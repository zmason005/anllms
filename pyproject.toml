[project]
name = "anllms"
version = "0.1.0"
description = "Explainable, citation-backed nutrient modeling layer for the NASEM (2021) dairy cattle model, built on top of the University of Guelph's nasem_dairy reference software."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "nasem_dairy==1.0.2",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
chat = [
    "flask",
    "openai",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anllms*"]
